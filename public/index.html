<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Song Generator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      font-size: 2.2rem;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 36px;
      font-size: 0.95rem;
    }

    .credits-bar {
      text-align: center;
      margin-bottom: 24px;
      font-size: 0.85rem;
      color: #666;
    }
    .credits-bar span { color: #a855f7; font-weight: 600; }

    .card {
      background: #141420;
      border: 1px solid #2a2a3a;
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 6px;
      font-weight: 500;
    }

    textarea, input[type="text"], select {
      width: 100%;
      padding: 12px 14px;
      background: #1a1a2e;
      border: 1px solid #2a2a3a;
      border-radius: 10px;
      color: #e0e0e0;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus, input[type="text"]:focus, select:focus {
      border-color: #a855f7;
    }

    textarea { resize: vertical; min-height: 100px; }

    .field { margin-bottom: 18px; }

    .row {
      display: flex;
      gap: 14px;
    }

    .row .field { flex: 1; }

    .toggle-row {
      display: flex;
      gap: 20px;
      margin-bottom: 18px;
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      color: #ccc;
    }

    .toggle-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #a855f7;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: white;
    }

    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .status-area {
      display: none;
      margin-top: 24px;
    }

    .status-area.visible { display: block; }

    .status-card {
      background: #141420;
      border: 1px solid #2a2a3a;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #2a2a3a;
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .status-text {
      font-size: 0.95rem;
      color: #aaa;
      margin-bottom: 4px;
    }

    .status-detail {
      font-size: 0.8rem;
      color: #666;
    }

    .results {
      display: none;
      margin-top: 24px;
    }

    .results.visible { display: block; }

    .track {
      background: #141420;
      border: 1px solid #2a2a3a;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .track-art {
      width: 80px;
      height: 80px;
      border-radius: 10px;
      background: #2a2a3a;
      flex-shrink: 0;
      object-fit: cover;
    }

    .track-info { flex: 1; min-width: 0; }

    .track-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: #fff;
    }

    .track-meta {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 12px;
    }

    .track audio {
      width: 100%;
      height: 40px;
      margin-bottom: 8px;
    }

    .download-link {
      display: inline-block;
      font-size: 0.85rem;
      color: #a855f7;
      text-decoration: none;
    }

    .download-link:hover { text-decoration: underline; }

    .error-msg {
      color: #f87171;
      background: #1a0a0a;
      border: 1px solid #3a1a1a;
      padding: 14px;
      border-radius: 10px;
      margin-top: 16px;
      font-size: 0.9rem;
      display: none;
    }

    .error-msg.visible { display: block; }

    .custom-fields { display: none; }
    .custom-fields.visible { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Song Generator</h1>
    <p class="subtitle">Describe your song and let AI create it for you</p>
    <div class="credits-bar" id="creditsBar">Loading credits...</div>

    <div class="card">
      <div class="field">
        <label for="prompt">Song Description / Lyrics</label>
        <textarea id="prompt" placeholder="Describe the song you want, e.g. 'An upbeat pop song about summer road trips with catchy chorus'"></textarea>
      </div>

      <div class="toggle-row">
        <label class="toggle-label">
          <input type="checkbox" id="customMode"> Custom Mode
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="instrumental"> Instrumental Only
        </label>
      </div>

      <div class="custom-fields" id="customFields">
        <div class="row">
          <div class="field">
            <label for="title">Song Title</label>
            <input type="text" id="title" placeholder="My Song">
          </div>
          <div class="field">
            <label for="style">Style / Genre</label>
            <input type="text" id="style" placeholder="Pop, Acoustic, Upbeat">
          </div>
        </div>
      </div>

      <div class="field">
        <label for="model">AI Model</label>
        <select id="model">
          <option value="V4_5ALL">V4.5 All (Recommended)</option>
          <option value="V5_5">V5.5 (Latest)</option>
          <option value="V5">V5</option>
          <option value="V4_5PLUS">V4.5 Plus</option>
          <option value="V4_5">V4.5</option>
          <option value="V4">V4</option>
        </select>
      </div>

      <button class="btn" id="generateBtn" onclick="generate()">Generate Song</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="status-area" id="statusArea">
      <div class="status-card">
        <div class="spinner"></div>
        <div class="status-text" id="statusText">Submitting your song...</div>
        <div class="status-detail" id="statusDetail">This usually takes 1-3 minutes</div>
      </div>
    </div>

    <div class="results" id="results"></div>
  </div>

  <script>
    const customModeCheckbox = document.getElementById("customMode");
    const customFields = document.getElementById("customFields");

    customModeCheckbox.addEventListener("change", () => {
      customFields.classList.toggle("visible", customModeCheckbox.checked);
    });

    // Load credits on page load
    (async function loadCredits() {
      try {
        const res = await fetch("/api/credits");
        const data = await res.json();
        if (data.code === 200 && data.data) {
          document.getElementById("creditsBar").innerHTML =
            `Credits remaining: <span>${data.data.remainingCredits ?? data.data.credits ?? JSON.stringify(data.data)}</span>`;
        }
      } catch {
        document.getElementById("creditsBar").textContent = "";
      }
    })();

    async function generate() {
      const prompt = document.getElementById("prompt").value.trim();
      if (!prompt) {
        showError("Please enter a song description.");
        return;
      }

      const btn = document.getElementById("generateBtn");
      const statusArea = document.getElementById("statusArea");
      const results = document.getElementById("results");

      btn.disabled = true;
      btn.textContent = "Generating...";
      hideError();
      results.classList.remove("visible");
      results.innerHTML = "";
      statusArea.classList.add("visible");
      updateStatus("Submitting your song...", "Sending request to AI");

      try {
        const body = {
          prompt,
          customMode: customModeCheckbox.checked,
          instrumental: document.getElementById("instrumental").checked,
          model: document.getElementById("model").value,
        };

        if (body.customMode) {
          body.title = document.getElementById("title").value.trim();
          body.style = document.getElementById("style").value.trim();
        }

        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });

        const data = await res.json();

        if (data.code !== 200 || !data.data?.taskId) {
          throw new Error(data.msg || data.error || "Failed to start generation");
        }

        const taskId = data.data.taskId;
        updateStatus("Song is being generated...", `Task ID: ${taskId}`);

        // Poll for results
        await pollForResult(taskId);
      } catch (err) {
        statusArea.classList.remove("visible");
        showError(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Generate Song";
      }
    }

    async function pollForResult(taskId) {
      const statusArea = document.getElementById("statusArea");
      const results = document.getElementById("results");
      const maxAttempts = 60; // 5 minutes max
      let attempt = 0;

      while (attempt < maxAttempts) {
        attempt++;
        await sleep(5000);

        try {
          const res = await fetch(`/api/status?taskId=${encodeURIComponent(taskId)}`);
          const data = await res.json();

          if (data.code !== 200) {
            throw new Error(data.msg || "Status check failed");
          }

          const status = data.data?.status;
          const sunoData = data.data?.response?.sunoData || data.data?.response?.data;

          if (status === "SUCCESS" && sunoData && sunoData.length > 0) {
            statusArea.classList.remove("visible");
            renderTracks(sunoData);
            return;
          }

          if (status === "CREATE_TASK_FAILED" || status === "GENERATE_AUDIO_FAILED" || status === "SENSITIVE_WORD_ERROR") {
            throw new Error(data.data?.errorMessage || `Generation failed: ${status}`);
          }

          // Update status display
          const statusMap = {
            PENDING: ["Queued for processing...", `Attempt ${attempt}/${maxAttempts}`],
            TEXT_SUCCESS: ["Lyrics generated, creating music...", "Almost there!"],
            FIRST_SUCCESS: ["First track ready, finishing up...", "Nearly done!"],
          };

          const [text, detail] = statusMap[status] || ["Generating your song...", `Status: ${status} | Attempt ${attempt}`];
          updateStatus(text, detail);
        } catch (err) {
          if (err.message.includes("failed") || err.message.includes("FAILED") || err.message.includes("SENSITIVE")) {
            statusArea.classList.remove("visible");
            showError(err.message);
            return;
          }
        }
      }

      statusArea.classList.remove("visible");
      showError("Generation timed out. Please try again.");
    }

    function renderTracks(tracks) {
      const results = document.getElementById("results");
      results.innerHTML = "<h2 style='margin-bottom:16px; font-size:1.3rem;'>Your Songs</h2>";

      tracks.forEach((track) => {
        const audioUrl = track.audio_url || track.audioUrl;
        const imageUrl = track.image_url || track.imageUrl || "";
        const title = track.title || "Untitled";
        const tags = track.tags || "";
        const duration = track.duration ? `${Math.floor(track.duration / 60)}:${String(Math.floor(track.duration % 60)).padStart(2, "0")}` : "";

        const div = document.createElement("div");
        div.className = "track";
        div.innerHTML = `
          ${imageUrl ? `<img class="track-art" src="${imageUrl}" alt="Cover art">` : '<div class="track-art"></div>'}
          <div class="track-info">
            <div class="track-title">${escapeHtml(title)}</div>
            <div class="track-meta">${escapeHtml(tags)}${duration ? ` | ${duration}` : ""}</div>
            ${audioUrl ? `<audio controls src="${audioUrl}"></audio>` : "<p>Audio processing...</p>"}
            ${audioUrl ? `<a class="download-link" href="${audioUrl}" target="_blank" download>Download MP3</a>` : ""}
          </div>
        `;
        results.appendChild(div);
      });

      results.classList.add("visible");
    }

    function updateStatus(text, detail) {
      document.getElementById("statusText").textContent = text;
      document.getElementById("statusDetail").textContent = detail;
    }

    function showError(msg) {
      const el = document.getElementById("errorMsg");
      el.textContent = msg;
      el.classList.add("visible");
    }

    function hideError() {
      document.getElementById("errorMsg").classList.remove("visible");
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function sleep(ms) {
      return new Promise((r) => setTimeout(r, ms));
    }
  </script>
</body>
</html>
